    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>


        /* =========================================
           MENU
        ========================================= */

        const menu =
            document.getElementById("menu");


        function toggleMenu() {

            menu.classList.toggle("ativo");

        }


        document.addEventListener(
            "click",
            function(event) {

                const clicouDentroMenu =
                    menu.contains(event.target);

                const clicouNoBotao =
                    event.target.closest("button");


                if (
                    !clicouDentroMenu &&
                    !clicouNoBotao
                ) {

                    menu.classList.remove("ativo");

                }

            }
        );



        /* =========================================
           LIVROS DO BANCO
        ========================================= */

        let todosOsLivros = [];



        async function carregarLivros() {

            try {

                const resposta =
                    await fetch(
                       "https://litelab-backend-novo.onrender.com/livros"
                    );


                if (!resposta.ok) {

                    throw new Error(
                        "Erro ao buscar livros."
                    );

                }


                todosOsLivros =
                    await resposta.json();


                console.log(
                    "Livros carregados:",
                    todosOsLivros
                );


                carregarDestaques();


            } catch (erro) {

                console.error(
                    "Erro ao carregar livros:",
                    erro
                );

            }

        }



        /* =========================================
           PESQUISA
        ========================================= */

        function buscarLivro() {


            const campo =
                document.getElementById("pesquisa");


            const resultados =
                document.getElementById(
                    "resultadosPesquisa"
                );


            const pesquisa =
                campo.value
                    .toLowerCase()
                    .trim();


            resultados.innerHTML = "";


            /* Se não digitou nada,
               não mostra resultados */

            if (pesquisa === "") {

                return;

            }


            /* Procura por:
               título
               autor
               categoria */

            const livrosEncontrados =
                todosOsLivros.filter(
                    function(livro) {


                        const titulo =
                            String(
                                livro.titulo || ""
                            )
                            .toLowerCase();


                        const autor =
                            String(
                                livro.autor || ""
                            )
                            .toLowerCase();


                        const categoria =
                            String(
                                livro.categoria || ""
                            )
                            .toLowerCase();


                        return (

                            titulo.includes(
                                pesquisa
                            )

                            ||

                            autor.includes(
                                pesquisa
                            )

                            ||

                            categoria.includes(
                                pesquisa
                            )

                        );

                    }
                );


            /* Nenhum resultado */

            if (
                livrosEncontrados.length === 0
            ) {

                resultados.innerHTML =
                    '<p class="resultado-vazio">' +
                    'Nenhum livro encontrado.' +
                    '</p>';

                return;

            }


            /* Mostra os resultados */

            livrosEncontrados.forEach(
                function(livro) {


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "livro-card";


                    const imagem =
                        document.createElement(
                            "img"
                        );


                    imagem.src =
                        livro.capa ||
                        "logo.png";


                    imagem.alt =
                        livro.titulo ||
                        "Livro";


                    const titulo =
                        document.createElement(
                            "p"
                        );


                    titulo.textContent =
                        livro.titulo ||
                        "Título não informado";


                    const autor =
                        document.createElement(
                            "p"
                        );


                    autor.textContent =
                        livro.autor ||
                        "Autor não informado";


                    card.appendChild(
                        imagem
                    );


                    card.appendChild(
                        titulo
                    );


                    card.appendChild(
                        autor
                    );


                    /* Abre o PDF */

                    if (livro.arquivo) {

                        card.onclick =
                            function() {

                                window.location.href =
                                    livro.arquivo;

                            };

                    }


                    resultados.appendChild(
                        card
                    );

                }
            );

        }



        /* =========================================
           DESTAQUES
           UMA ÚNICA FILEIRA
        ========================================= */

        let indiceDestaques = 0;


        const containerDestaques =
            document.getElementById(
                "livrosDestaques"
            );


        const botaoAnterior =
            document.getElementById(
                "prevDestaques"
            );


        const botaoProximo =
            document.getElementById(
                "nextDestaques"
            );



        function carregarDestaques() {


            containerDestaques.innerHTML =
                "";


            if (
                !todosOsLivros ||
                todosOsLivros.length === 0
            ) {

                return;

            }


            /*
             * Usa os livros existentes
             * no banco.
             *
             * Não cria outra fileira.
             */

            todosOsLivros.forEach(
                function(livro) {


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "livro-card";


                    const imagem =
                        document.createElement(
                            "img"
                        );


                    imagem.src =
                        livro.capa ||
                        "logo.png";


                    imagem.alt =
                        livro.titulo ||
                        "Livro";


                    const titulo =
                        document.createElement(
                            "p"
                        );


                    titulo.textContent =
                        livro.titulo ||
                        "Título não informado";


                    card.appendChild(
                        imagem
                    );


                    card.appendChild(
                        titulo
                    );


                    if (livro.arquivo) {

                        card.onclick =
                            function() {

                                window.location.href =
                                    livro.arquivo;

                            };

                    }


                    containerDestaques.appendChild(
                        card
                    );

                }
            );


            indiceDestaques = 0;


            containerDestaques.style.transform =
                "translateX(0px)";

        }



        /* =========================================
           BOTÃO PRÓXIMO
        ========================================= */

        botaoProximo.onclick =
            function() {


                const cards =
                    containerDestaques
                        .children;


                if (
                    cards.length === 0
                ) {

                    return;

                }


                const maximo =
                    Math.max(
                        0,
                        cards.length - 4
                    );


                if (
                    indiceDestaques <
                    maximo
                ) {

                    indiceDestaques++;


                    containerDestaques.style.transform =
                        "translateX(-" +
                        (
                            indiceDestaques *
                            225
                        ) +
                        "px)";

                }

            };



        /* =========================================
           BOTÃO ANTERIOR
        ========================================= */

        botaoAnterior.onclick =
            function() {


                if (
                    indiceDestaques > 0
                ) {

                    indiceDestaques--;


                    containerDestaques.style.transform =
                        "translateX(-" +
                        (
                            indiceDestaques *
                            225
                        ) +
                        "px)";

                }

            };



        /* =========================================
           INICIA
        ========================================= */

        carregarLivros();


    </script>
