         SCRIPT DO MENU
    ========================= -->

    <script>

        const menu =
            document.getElementById("menu");

        const botaoMenu =
            document.querySelector(".cabecalho button");


        function toggleMenu() {

            menu.classList.toggle("ativo");


            if (
                menu.classList.contains("ativo")
            ) {

                botaoMenu.classList.add(
                    "escondido"
                );

            } else {

                botaoMenu.classList.remove(
                    "escondido"
                );

            }

        }


        document.addEventListener(
            "click",
            function(event) {

                const clicouDentroMenu =
                    menu.contains(event.target);

                const clicouNoBotao =
                    event.target.closest(
                        ".cabecalho button"
                    );


                if (
                    !clicouDentroMenu &&
                    !clicouNoBotao
                ) {

                    menu.classList.remove(
                        "ativo"
                    );

                    botaoMenu.classList.remove(
                        "escondido"
                    );

                }

            }
        );

    </script>

    <!-- =========================
         SCRIPT DA PESQUISA
    ========================= -->

    <script>

        function buscarLivro() {

            const campo =
                document.getElementById(
                    "pesquisa"
                );


            const texto =
                campo.value
                    .toLowerCase()
                    .normalize("NFD")
                    .replace(
                        /[\u0300-\u036f]/g,
                        ""
                    )
                    .trim();


            const livros =
                document.querySelectorAll(
                    "#listaLivros .livro-card"
                );


            let encontrou = false;


            livros.forEach(
                function(livro) {

                    const dados =
                        livro
                            .getAttribute(
                                "data-pesquisa"
                            )
                            .toLowerCase()
                            .normalize("NFD")
                            .replace(
                                /[\u0300-\u036f]/g,
                                ""
                            );


                    if (
                        texto === "" ||
                        dados.includes(texto)
                    ) {

                        livro.classList.remove(
                            "oculto"
                        );

                        encontrou = true;

                    } else {

                        livro.classList.add(
                            "oculto"
                        );

                    }

                }
            );


            let mensagem =
                document.getElementById(
                    "mensagemPesquisa"
                );


            if (!mensagem) {

                mensagem =
                    document.createElement(
                        "p"
                    );

                mensagem.id =
                    "mensagemPesquisa";

                mensagem.className =
                    "mensagem-pesquisa";


                document
                    .getElementById(
                        "listaLivros"
                    )
                    .parentNode
                    .insertBefore(
                        mensagem,
                        document.getElementById(
                            "listaLivros"
                        )
                    );

            }


            if (
                texto !== "" &&
                !encontrou
            ) {

                mensagem.textContent =
                    "Nenhum livro encontrado.";

            } else {

                mensagem.textContent = "";

            }

        }

    </script>


    <!-- =========================
         SISTEMA DE FAVORITOS
    ========================= -->

    <script>

        const favoritos =
            document.querySelectorAll(
                ".favorito"
            );

        const usuario =
            localStorage.getItem(
                "nomeUsuario"
            );


        /* =========================
           CARREGAR FAVORITOS
        ========================= */

        if (usuario) {

            fetch(
                "https://://litelab-backend-novo.onrender.com/favoritos?usuario="
                + encodeURIComponent(usuario)
            )

            .then(
                resposta => {

                    if (!resposta.ok) {

                        throw new Error(
                            "Erro ao buscar favoritos"
                        );

                    }

                    return resposta.json();

                }
            )

            .then(
                livrosFavoritos => {

                    favoritos.forEach(
                        estrela => {

                            const card =
                                estrela.closest(
                                    ".livro-card"
                                );


                            const link =
                                card.querySelector(
                                    "a"
                                );


                            const caminhoPDF =
                                link.getAttribute(
                                    "href"
                                );


                            const livroNome =
                                caminhoPDF
                                    .split("/")
                                    .pop()
                                    .replace(
                                        ".pdf",
                                        ""
                                    );


                            const encontrado =
                                livrosFavoritos.some(
                                    livro =>
                                        livro.livro_nome ===
                                        livroNome
                                );


                            if (encontrado) {

                                estrela.textContent =
                                    "★";

                                estrela.classList.add(
                                    "ativo"
                                );

                                estrela.style.color =
                                    "gold";

                            }

                        }
                    );

                }
            )

            .catch(
                erro => {

                    console.error(
                        "Erro ao carregar favoritos:",
                        erro
                    );

                }
            );

        }


        /* =========================
           CLICAR NA ESTRELA
        ========================= */

        favoritos.forEach(
            estrela => {

                estrela.addEventListener(
                    "click",
                    async function() {


                        const card =
                            this.closest(
                                ".livro-card"
                            );


                        const link =
                            card.querySelector(
                                "a"
                            );


                        const imagem =
                            card.querySelector(
                                "img"
                            );


                        const caminhoPDF =
                            link.getAttribute(
                                "href"
                            );


                        const livroNome =
                            caminhoPDF
                                .split("/")
                                .pop()
                                .replace(
                                    ".pdf",
                                    ""
                                );


                        const usuario =
                            localStorage.getItem(
                                "nomeUsuario"
                            );


                        /* =========================
                           VERIFICAR LOGIN
                        ========================= */

                        if (!usuario) {

                            alert(
                                "Você precisa estar logado para favoritar um livro."
                            );

                            return;

                        }


                        /* =========================
                           DESFAVORITAR
                        ========================= */

                        if (
                            this.classList.contains(
                                "ativo"
                            )
                        ) {

                            this.classList.remove(
                                "ativo"
                            );

                            this.textContent =
                                "☆";

                            this.style.color =
                                "";


                            try {

                                const resposta =
                                    await fetch(
                                        "https://://litelab-backend-novo.onrender.com/desfavoritar",
                                        {

                                            method:
                                                "POST",

                                            headers: {
                                                "Content-Type":
                                                    "application/json"
                                            },

                                            body:
                                                JSON.stringify({

                                                    usuario:
                                                        usuario,

                                                    livro_nome:
                                                        livroNome

                                                })

                                        }
                                    );


                                const mensagem =
                                    await resposta.text();


                                console.log(
                                    "RESPOSTA DESFAVORITAR:",
                                    mensagem
                                );


                                if (
                                    !resposta.ok
                                ) {

                                    throw new Error(
                                        mensagem
                                    );

                                }


                            } catch (erro) {

                                console.error(
                                    "Erro ao remover favorito:",
                                    erro
                                );


                                this.classList.add(
                                    "ativo"
                                );

                                this.textContent =
                                    "★";

                                this.style.color =
                                    "gold";

                            }


                            return;

                        }


                        /* =========================
                           FAVORITAR
                        ========================= */

                        this.classList.add(
                            "ativo"
                        );

                        this.textContent =
                            "★";

                        this.style.color =
                            "gold";


                        try {

                            const resposta =
                                await fetch(
                                    "https://://litelab-backend-novo.onrender.com/favoritar",
                                    {

                                        method:
                                            "POST",

                                        headers: {
                                            "Content-Type":
                                                "application/json"
                                        },

                                        body:
                                            JSON.stringify({

                                                usuario:
                                                    usuario,

                                                livro_nome:
                                                    livroNome,

                                                livro_imagem:
                                                    imagem.src

                                            })

                                    }
                                );


                            const mensagem =
                                await resposta.text();


                            console.log(
                                "RESPOSTA FAVORITAR:",
                                mensagem
                            );


                            if (
                                !resposta.ok
                            ) {

                                throw new Error(
                                    mensagem
                                );

                            }


                        } catch (erro) {

                            console.error(
                                "Erro ao salvar favorito:",
                                erro
                            );


                            this.classList.remove(
                                "ativo"
                            );

                            this.textContent =
                                "☆";

                            this.style.color =
                                "";

                        }

                    }
                );

            }
        );

    </script>
