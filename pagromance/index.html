    <script>

        const menu =
            document.getElementById("menu");

        const botaoMenu =
            document.querySelector(".cabecalho button");


        function toggleMenu() {

            menu.classList.toggle("ativo");


            if (menu.classList.contains("ativo")) {

                botaoMenu.classList.add("escondido");

            } else {

                botaoMenu.classList.remove("escondido");

            }

        }


        document.addEventListener("click", function(event) {

            const clicouDentroMenu =
                menu.contains(event.target);

            const clicouNoBotao =
                event.target.closest(".cabecalho button");


            if (
                !clicouDentroMenu &&
                !clicouNoBotao
            ) {

                menu.classList.remove("ativo");

                botaoMenu.classList.remove(
                    "escondido"
                );

            }

        });

    </script>

    <script>

        function buscarLivro() {

            const campo =
                document.getElementById("pesquisa");


            const texto =
                campo.value
                    .toLowerCase()
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .trim();


            const livros =
                document.querySelectorAll(".livro-card");


            let encontrou = false;


            livros.forEach(function(livro) {

                const dados =
                    livro.getAttribute("data-pesquisa");


                if (!dados) {

                    return;

                }


                const dadosNormalizados =
                    dados
                        .toLowerCase()
                        .normalize("NFD")
                        .replace(/[\u0300-\u036f]/g, "");


                if (
                    texto === "" ||
                    dadosNormalizados.includes(texto)
                ) {

                    livro.classList.remove("oculto");

                    encontrou = true;

                } else {

                    livro.classList.add("oculto");

                }

            });


            const mensagem =
                document.getElementById(
                    "mensagemPesquisa"
                );


            if (
                texto !== "" &&
                !encontrou
            ) {

                mensagem.textContent =
                    "Nenhum livro encontrado.";

            } else {

                mensagem.textContent = "";

            }

        }

    </script>


    <!-- ========================================== -->
    <!-- SISTEMA DE FAVORITOS -->
    <!-- ========================================== -->

    <script>

        const favoritos =
            document.querySelectorAll(".favorito");


        const usuario =
            localStorage.getItem("nomeUsuario");


        // ==========================================
        // CARREGAR FAVORITOS SALVOS
        // ==========================================

        if (usuario) {

            fetch(
                "https://://litelab-backend-novo.onrender.com/favoritos?usuario="
                + encodeURIComponent(usuario)
            )

            .then(resposta => resposta.json())

            .then(livrosFavoritos => {

                console.log(
                    "FAVORITOS DO BANCO:",
                    livrosFavoritos
                );


                favoritos.forEach(estrela => {

                    const card =
                        estrela.closest(".livro-card");


                    const link =
                        card.querySelector("a");


                    const caminhoPDF =
                        link.getAttribute("href");


                    const livroNome =
                        caminhoPDF
                            .split("/")
                            .pop()
                            .replace(".pdf", "");


                    console.log(
                        "NOME DO LIVRO NA CATEGORIA:",
                        livroNome
                    );


                    const encontrado =
                        livrosFavoritos.some(
                            livro =>
                                livro.livro_nome === livroNome
                        );


                    if (encontrado) {

                        estrela.textContent = "★";

                        estrela.classList.add(
                            "ativo"
                        );

                        estrela.style.color =
                            "gold";

                    }

                });

            });

        }


        // ==========================================
        // CLICAR NA ESTRELA
        // ==========================================

        favoritos.forEach(estrela => {

            estrela.addEventListener(
                "click",
                async function() {


                    this.classList.toggle(
                        "ativo"
                    );


                    // ==========================================
                    // DESFAVORITAR
                    // ==========================================

                    if (
                        !this.classList.contains(
                            "ativo"
                        )
                    ) {

                        this.textContent = "☆";


                        const card =
                            this.closest(".livro-card");


                        const link =
                            card.querySelector("a");


                        const caminhoPDF =
                            link.getAttribute("href");


                        const livroNome =
                            caminhoPDF
                                .split("/")
                                .pop()
                                .replace(".pdf", "");


                        const usuario =
                            localStorage.getItem(
                                "nomeUsuario"
                            );


                        if (!usuario) {

                            return;

                        }


                        try {

                            const resposta =
                                await fetch(
                                    "https://://litelab-backend-novo.onrender.com/desfavoritar",
                                    {

                                        method: "POST",

                                        headers: {
                                            "Content-Type":
                                                "application/json"
                                        },

                                        body:
                                            JSON.stringify({

                                                usuario:
                                                    usuario,

                                                livro_nome:
                                                    livroNome

                                            })

                                    }
                                );


                            const mensagem =
                                await resposta.text();


                            console.log(
                                "RESPOSTA DESFAVORITAR:",
                                mensagem
                            );


                        } catch (erro) {

                            console.error(
                                "Erro ao remover favorito:",
                                erro
                            );

                        }


                        return;

                    }


                    // ==========================================
                    // FAVORITAR
                    // ==========================================

                    this.textContent = "★";


                    const card =
                        this.closest(".livro-card");


                    const link =
                        card.querySelector("a");


                    const imagem =
                        card.querySelector("img");


                    const caminhoPDF =
                        link.getAttribute("href");


                    const livroNome =
                        caminhoPDF
                            .split("/")
                            .pop()
                            .replace(".pdf", "");


                    const usuario =
                        localStorage.getItem(
                            "nomeUsuario"
                        );


                    if (!usuario) {

                        alert(
                            "Você precisa estar logado para favoritar um livro."
                        );


                        this.classList.remove(
                            "ativo"
                        );


                        this.textContent = "☆";


                        return;

                    }


                    try {

                        const resposta =
                            await fetch(
                                "https://://litelab-backend-novo.onrender.com/favoritar",
                                {

                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "text/plain"
                                    },

                                    body:
                                        JSON.stringify({

                                            usuario:
                                                usuario,

                                            livro_nome:
                                                livroNome,

                                            livro_imagem:
                                                imagem.src

                                        })

                                }
                            );


                        const mensagem =
                            await resposta.text();


                        alert(mensagem);


                    } catch (erro) {

                        console.error(erro);


                        alert(
                            "Não foi possível salvar o favorito."
                        );


                        this.classList.remove(
                            "ativo"
                        );


                        this.textContent = "☆";

                    }

                }
            );

        });

    </script>
