      <script>
          const menu = document.getElementById("menu");
          
          function toggleMenu() {
            menu.classList.toggle("ativo");
          }
          
      
          document.addEventListener("click", function(event) {
            const clicouDentroMenu = menu.contains(event.target);
            const clicouNoBotao = event.target.closest("button");
          
            if (!clicouDentroMenu && !clicouNoBotao) {
              menu.classList.remove("ativo");
            }
          });
          </script>
    
    <h1 class = "titulo">
        Clubes de Leitura
    </h1>

    <div class = "pesquisa">
      <input
        type = "text"
        id = "pesquisa"
        placeholder = "Pesquisar livro ou clube"
        onkeyup = "pesquisarClube()">
      </div>
    
      <div class="clubes" id="listaClubes">

    <script>

async function entrarClube(id) {

const usuario = localStorage.getItem("nomeUsuario");

if (!usuario) {
    console.error("Usuário não encontrado.");
    return;
}

try {

    const resposta = await fetch(
        "https://litelab-backend-novo.onrender.com/entrarClube",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                clube_id: String(id),
                usuario: usuario
            })
        }
    );

    const resultado = await resposta.text();

    console.log(resultado);

    window.location.href =
        "entrarnoclube.html?id=" + id;

} catch (erro) {

    console.error(
        "Erro ao entrar no clube:",
        erro
    );

}
}  
        function pesquisarClube(){
        
        let texto = document
            .getElementById("pesquisa")
            .value
            .toLowerCase();
        
        let cards = document.querySelectorAll(".card");
        
        cards.forEach(card => {
        
        let titulo = card.querySelector("h2")
            .textContent
            .toLowerCase();
        
        if(titulo.includes(texto)){
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }
        
            });
        }
        
        </script>

<script>

    async function carregarClubes() {
    
        const lista = document.getElementById("listaClubes");
    
        try {
    
            const resposta = await fetch("https://litelab-backend-novo.onrender.com/clubes");
            const clubes = await resposta.json();
    
            lista.innerHTML = "";
    
            clubes.forEach(clube => {
    
                lista.innerHTML += `
                    <div class="card">
    
                        <div class="titulo-card">
                            <h2>📚 ${clube.nome}</h2>
    
                           <button class="button2" onclick="abrirCalendario(${clube.id})">
    Calendário
</button>
                        </div>
    
                        <p>Presidente: ${clube.presidente}</p>
    
                        <p>Máximo de ${clube.max_membros} membros</p>
    
                        <p>${clube.descricao}</p>
    
                        <p>Gênero: ${clube.genero_principal}</p>
    
                      <button onclick="entrarClube(${clube.id})" class="button2">
    Entrar no Clube
</button>
                    </div>
                `;
            });
    
        } catch (erro) {
    
            console.error("Erro ao carregar clubes:", erro);
    
        }
    }
    
    carregarClubes();
    function abrirCalendario(id) {
    window.location.href =
        "../partemaria/calendario.html?id=" + id;
}
    
    </script>
