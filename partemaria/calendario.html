<main>

<h1>Calendário do Clube</h1>

<div class="acoes">

<button onclick="criar()">Criar Evento</button>

<button onclick="editar()">Editar Evento</button>
<button onclick="excluir()">Excluir Evento</button>

<button onclick="mostrar()">Mostrar/Ocultar</button>



</div>

<div class="card" id="cal">

<h2>Eventos do Clube</h2>

<table>

<thead>

<tr>
<th>Evento</th>
<th>Data</th>
</tr>

</thead>

<tbody id="tb">
    
    <tr>
        <td>Feira de Livros</td>
        <td>18/08/2026</td>
    </tr>
    
    <tr>
        <td>Reunião dos Membros</td>
        <td>25/08/2026</td>
    </tr>
    
    </tbody>
    
    </table>
    
    </div>
    
    </main>
    
    <div class="toast" id="toast"></div>
    
    <script>

    
    //==============================
    // TOAST
    //==============================
    
    function msg(texto){
    
        const toast=document.getElementById("toast");
    
        toast.innerHTML=texto;
    
        toast.style.display="block";
    
        setTimeout(function(){
    
            toast.style.display="none";
    
        },2000);
    
    }
    
    //==============================
    // CRIAR EVENTO
    //==============================
    const parametros = new URLSearchParams(window.location.search);
const clubeId = parametros.get("id");

console.log("CLUBE:", clubeId);
async function carregarEventos() {

const resposta = await fetch(
    "http://192.168.0.165:8081/eventos?clube_id=" + clubeId
);

const eventos = await resposta.json();

const tabela = document.getElementById("tb");

tabela.innerHTML = "";
eventos.forEach(evento => {

const linha = document.createElement("tr");

linha.dataset.id = evento.id;

const partes = evento.data_evento.split("-");

const dataFormatada =
    partes[2] + "/" +
    partes[1] + "/" +
    partes[0];

linha.innerHTML = `
    <td>${evento.nome_evento}</td>
    <td>${dataFormatada}</td>
`;

tabela.appendChild(linha);
});
}

carregarEventos();
async function criar(){

let evento = prompt("Nome do evento:");
let data = prompt("Data do evento (DD/MM/AAAA):");

if(data){

    const partes = data.split("/");

    if(partes.length === 3){
        data = partes[2] + "-" + partes[1] + "-" + partes[0];
    }
}

if(!evento || !data){
    return;
}

const resposta = await fetch(
    "http://192.168.0.165:8081/criarEvento",
    {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            clube_id: String(clubeId),
            nome_evento: evento,
            data_evento: data
        })
    }
);

const resultado = await resposta.text();

msg(resultado);

carregarEventos();
}
    
    //==============================
    // EDITAR EVENTO
    //==============================
    
    async function editar(){

if(tb.rows.length == 0){

    msg("Nenhum evento.");
    return;

}

let escolha = prompt(
    "Digite o número do evento que deseja editar:\n\n" +
    Array.from(tb.rows).map((linha, i) =>
        (i + 1) + " - " + linha.cells[0].innerHTML +
        " (" + linha.cells[1].innerHTML + ")"
    ).join("\n")
);

if(!escolha){
    return;
}

let indice = parseInt(escolha) - 1;

if(
    isNaN(indice) ||
    indice < 0 ||
    indice >= tb.rows.length
){

    msg("Evento inválido.");
    return;

}

let linha = tb.rows[indice];

let id = linha.dataset.id;

let evento = prompt(
    "Novo nome do evento:",
    linha.cells[0].innerHTML
);

let data = prompt(
    "Nova data (DD/MM/AAAA):",
    linha.cells[1].innerHTML
);

if(!evento || !data){
    return;
}

const partes = data.split("/");

if(partes.length !== 3){

    msg("Use a data no formato DD/MM/AAAA.");
    return;

}

const dataBanco =
    partes[2] + "-" +
    partes[1] + "-" +
    partes[0];

const resposta = await fetch(
    "http://192.168.0.165:8081/editarEvento",
    {
        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            id: String(id),
            nome_evento: evento,
            data_evento: dataBanco
        })
    }
);

const resultado = await resposta.text();

msg(resultado);

carregarEventos();
}
async function excluir(){

if(tb.rows.length == 0){

    msg("Nenhum evento.");
    return;

}

let escolha = prompt(
    "Digite o número do evento que deseja excluir:\n\n" +
    Array.from(tb.rows).map((linha, i) =>
        (i + 1) + " - " + linha.cells[0].innerHTML +
        " (" + linha.cells[1].innerHTML + ")"
    ).join("\n")
);

if(!escolha){
    return;
}

let indice = parseInt(escolha) - 1;

if(
    isNaN(indice) ||
    indice < 0 ||
    indice >= tb.rows.length
){

    msg("Evento inválido.");
    return;

}

let linha = tb.rows[indice];

let id = linha.dataset.id;

let confirmar = confirm(
    "Tem certeza que deseja excluir o evento \"" +
    linha.cells[0].innerHTML +
    "\"?"
);

if(!confirmar){
    return;
}

const resposta = await fetch(
    "http://192.168.0.165:8081/excluirEvento",
    {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            id: String(id)
        })
    }
);

const resultado = await resposta.text();

msg(resultado);

carregarEventos();
}
    //==============================
    // EXCLUIR EVENTO
    //==============================
    
    
   
    
    //==============================
    // MOSTRAR / OCULTAR
    //==============================
    
    let visivel=true;
    
    function mostrar(){
    
        visivel=!visivel;
    
        document.getElementById("cal").style.display=visivel ? "block" : "none";
    
    }
    
  
    
    </script>
    
    </body>
