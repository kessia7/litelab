<script>


/* =====================================================
ABRIR MODAL
===================================================== */

function abrirModal() {

document
    .getElementById("modal")
    .classList.add("aberto");

}



/* =====================================================
FECHAR MODAL
===================================================== */

function fecharModal() {

document
    .getElementById("modal")
    .classList.remove("aberto");

}



/* =====================================================
FECHAR CLICANDO FORA DO MODAL
===================================================== */

document
.getElementById("modal")
.addEventListener("click", function(event) {

    if (event.target === this) {

        fecharModal();

    }

});



/* =====================================================
   CURTIR RESENHA
===================================================== */

async function curtir(botao) {

const resenhaId =
    botao.getAttribute("data-id");

const usuario =
    localStorage.getItem("nomeUsuario");

if (!resenhaId) {

    alert("ID da resenha não encontrado.");

    return;
}

if (!usuario) {

    alert("Usuário não identificado.");

    return;
}

try {

    const resposta = await fetch(
        "http://https://litelab-backend-novo.onrender.com/curtirResenha",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                resenha_id: resenhaId,
                usuario: usuario
            })
        }
    );

    const mensagem =
        await resposta.text();

    if (!resposta.ok) {

        alert(mensagem);

        return;
    }

    const numero =
        botao.querySelector("span");

    const coracao =
        botao.querySelector("svg");

    let quantidade =
        parseInt(numero.textContent) || 0;

    if (mensagem === "Resenha curtida!") {

        quantidade++;

        botao.classList.add("liked");

        coracao.setAttribute(
            "fill",
            "#064f52"
        );

    } else if (
        mensagem === "Curtida removida."
    ) {

        quantidade--;

        if (quantidade < 0) {
            quantidade = 0;
        }

        botao.classList.remove("liked");

        coracao.setAttribute(
            "fill",
            "none"
        );
    }

    numero.textContent =
        quantidade;

} catch (erro) {

    console.error(erro);

    alert(
        "Não foi possível conectar ao servidor."
    );
}
}
/* =====================================================
COMPARTILHAR
===================================================== */

function compartilhar() {


if (navigator.share) {


    navigator.share({

        title: "LitelLAB - Resenha",

        text: "Confira esta resenha no LitelLAB!"

    });


} else {


    navigator.clipboard.writeText(
        window.location.href
    );


    alert("Link copiado!");

}

}



/* =====================================================
ADICIONAR NOVA RESENHA
===================================================== */

async function adicionarResenha() {

const livro =
    document.getElementById("nomeLivro").value;

const autor =
    document.getElementById("nomeAutor").value;

const nota =
    document.getElementById("notaLivro").value;

const texto =
    document.getElementById("textoResenha").value;

const usuario =
    localStorage.getItem("nomeUsuario");

if (
    !livro ||
    !autor ||
    !nota ||
    !texto
) {

    alert("Preencha todos os campos da resenha.");

    return;
}

if (!usuario) {

    alert("Usuário não identificado.");

    return;
}

try {

async function excluirResenha(botao) {
    const id = botao.dataset.id;

    console.log("ID:", id);
console.log("USUÁRIO:", usuario);

    if (!confirm("Tem certeza que deseja excluir esta resenha?")) {
        return;
    }

    try {
        const resposta = await fetch("http://https://litelab-backend-novo.onrender.com/excluirResenha", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                resenha_id: Number(id),
                usuario: usuario
            })
        });
        const resultado = await resposta.text();

if (resposta.ok) {
    alert(resultado);
    carregarResenhas();
} else {
    alert(resultado || "Não foi possível excluir a resenha.");
}
    } catch (erro) {
        console.error("Erro ao excluir resenha:", erro);
        alert("Erro ao conectar com o servidor.");
    }
}
async function atualizarContadorComentarios(resenhaId) {

try {

    const resposta = await fetch(
        "http://https://litelab-backend-novo.onrender.com/listarComentarios?resenha_id="
        + encodeURIComponent(resenhaId)
    );

    if (!resposta.ok) {
        return;
    }

    const comentarios = await resposta.json();

    const contador = document.getElementById(
        "contador-comentarios-" + resenhaId
    );

    if (contador) {
        contador.textContent = comentarios.length;
    }

} catch (erro) {

    console.error(
        "Erro ao atualizar contador:",
        erro
    );

}
}

async function abrirComentarios(botao) {

const resenhaId = botao.dataset.id;

const card = botao.closest(".card");

let area = card.querySelector(".comentarios-container");

if (area) {
    area.remove();
    return;
}

area = document.createElement("div");

area.className = "comentarios-container";

area.innerHTML = `
    <strong style="color:#075d59;">
        Comentários
    </strong>

    <div class="lista-comentarios">
        Carregando comentários...
    </div>

    <div class="comentario-form">

        <input
            type="text"
            placeholder="Escreva um comentário..."
            class="campo-comentario"
        >

        <button
            onclick="enviarComentario(this, '${resenhaId}')"
        >
            Comentar
        </button>

    </div>
`;

card.appendChild(area);

try {

    const resposta = await fetch(
        "http://https://litelab-backend-novo.onrender.com/listarComentarios?resenha_id="
        + encodeURIComponent(resenhaId)
    );

    if (!resposta.ok) {
        throw new Error("Erro ao buscar comentários.");
    }

    const comentarios = await resposta.json();

    // ATUALIZA O CONTADOR
    const contador = document.getElementById(
        "contador-comentarios-" + resenhaId
    );

    if (contador) {
        contador.textContent = comentarios.length;
    }

    const lista =
        area.querySelector(".lista-comentarios");

    if (comentarios.length === 0) {

        lista.innerHTML = `
            <p style="font-size:13px;color:#597674;">
                Ainda não há comentários.
            </p>
        `;

        return;
    }

    lista.innerHTML = "";

    comentarios.forEach(comentario => {

        lista.innerHTML += `
            <div class="comentario-item">

                <div class="comentario-usuario">
                    ${comentario.usuario}
                </div>

                <div class="comentario-texto">
                    ${comentario.comentario}
                </div>

            </div>
        `;

    });

} catch (erro) {

    console.error(
        "Erro ao carregar comentários:",
        erro
    );

    alert("Não foi possível carregar os comentários.");
}
}

async function enviarComentario(botao, resenhaId) {

const area =
    botao.closest(".comentarios-container");

const campo =
    area.querySelector(".campo-comentario");

const comentario =
    campo.value.trim();

const usuario =
    localStorage.getItem("nomeUsuario");

if (!comentario) {

    alert("Escreva um comentário.");

    return;
}

if (!usuario) {

    alert("Usuário não identificado.");

    return;
}

try {

    const resposta = await fetch(
        "http://https://litelab-backend-novo.onrender.com/cadastrarComentario",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                resenha_id: Number(resenhaId),
                usuario: usuario,
                comentario: comentario
            })
        }
    );

    const mensagem =
        await resposta.text();

    if (!resposta.ok) {

        alert(mensagem);

        return;
    }

    // Limpa o campo
    campo.value = "";

    // Busca novamente os comentários
    const novaResposta = await fetch(
        "http://https://litelab-backend-novo.onrender.com/listarComentarios?resenha_id="
        + encodeURIComponent(resenhaId)
    );

    const comentarios =
        await novaResposta.json();

    // Atualiza o contador
    const contador =
        document.getElementById(
            "contador-comentarios-" + resenhaId
        );

    if (contador) {
        contador.textContent = comentarios.length;
    }

    // Atualiza a lista
    const lista =
        area.querySelector(".lista-comentarios");

    lista.innerHTML = "";

    comentarios.forEach(comentario => {

        lista.innerHTML += `
            <div class="comentario-item">

                <div class="comentario-usuario">
                    ${comentario.usuario}
                </div>

                <div class="comentario-texto">
                    ${comentario.comentario}
                </div>

            </div>
        `;

    });

} catch (erro) {

    console.error(
        "Erro ao enviar comentário:",
        erro
    );

    alert(
        "Não foi possível conectar ao servidor."
    );
}
}

    </script>
