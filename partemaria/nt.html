<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LiteLAB - Notificações</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background-color:#006161;
    font-family:Cambria, Georgia, serif;
}

/*=========================
      MENU LATERAL
=========================*/

#menu{
    list-style:none;
    margin:0;
    padding:20px;
    width:220px;
    position:fixed;
    top:0;
    left:-300px;
    height:100vh;
    background-color:#006161;
    transition:left 0.3s ease;
    z-index:2000;
}

#menu.ativo{
    left:0;
}

#menu li{
    margin-bottom:10px;
}

#menu a{
    display:block;
    background-color:#008B8B;
    color:white;
    text-decoration:none;
    padding:12px;
    border-radius:10px;
}

/* BOTÃO DO MENU */

.cabecalho button{
    position:absolute;
    top:20px;
    left:20px;
    padding:8px 12px;
    border-radius:8px;
    border:none;
    background-color:white;
    color:black;
    cursor:pointer;
    font-family:Cambria, Georgia, serif;
    font-size:16px;
    z-index:1000;
}

.cabecalho button:hover{
    background-color:#008B8B;
    color:white;
}

/*=========================
        CABEÇALHO
=========================*/

.cabecalho{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:50px;
}

/*=========================
        CONTEÚDO
=========================*/

.conteudo{
    margin-left:220px;
    padding:25px;
}

.topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.topo h1{
    color:white;
    font-size:52px;
    text-align:center;
    margin:20px 0 30px;
}

/*=========================
        CARDS
=========================*/

.lista{
    display:flex;
    flex-direction:column;
    gap:18px;
    width:3000px;
    max-width:100%;
    margin-left:-200px;
}

.card{
    background:white;
    border-radius:18px;
    padding:18px;
    display:flex;
    align-items:center;
    gap:18px;
    cursor:pointer;
    transition:.25s;
}

.card:hover{
    transform:translateY(-3px);
    box-shadow:0 6px 18px rgba(0,0,0,.15);
}

/* Ícone */

.icone{
    width:60px;
    height:60px;
    border-radius:50%;
    background:#00867f;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-shrink:0;
}

.icone::after{
    content:"";
    width:22px;
    height:22px;
    background:white;
    border-radius:50%;
}

.info{
    flex:1;
}

.info h3{
    color:#08645f;
    margin-bottom:6px;
}

.info p{
    color:#666;
}

.hora{
    color:#999;
    font-size:13px;
}

.lida{
    opacity:.65;
}

/*=========================
        MODAL
=========================*/

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:3000;
}

.modal.aberto{
    display:flex;
}

.caixa{
    width:450px;
    max-width:90%;
    background:white;
    border-radius:20px;
    padding:25px;
}

.caixa h2{
    color:#08645f;
    margin-bottom:15px;
}

.fechar{
    width:100%;
    height:42px;
    border:none;
    border-radius:10px;
    background:#00867f;
    color:white;
    cursor:pointer;
    font-size:16px;
    margin-top:20px;
}

.fechar:hover{
    background:#006f69;
}

/*=========================
         TOAST
=========================*/

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#00867f;
    color:white;
    padding:15px 20px;
    border-radius:10px;
    opacity:0;
    transition:.3s;
    z-index:4000;
}

.toast.mostrar{
    opacity:1;
}

</style>

</head>

<body>

<div class="cabecalho">

    <button onclick="toggleMenu()">☰ Menu</button>

</div>

<ul id="menu">

    <li>
        <a href="../partlaisla/index.html">
            Página principal
        </a>
    </li>

    <li>
        <a href="../partlaisla/perfil.html">
            Perfil
        </a>
    </li>

    <li>
        <a href="../index.html">
            Biblioteca
        </a>
    </li>

    <li>
        <a href="../partlaisla/estatisticas.html">
            Estatísticas
        </a>
    </li>

    <li>
        <a href="../partemaria/vendas.html">
            Vendas
        </a>
    </li>

    <li>
        <a href="../parteclubes/clubes.html">
            Clubes
        </a>
    </li>

    <li>
        <a href="../partlaisla/cadastrolivros.html">
            Cadastro de livros
        </a>
    </li>

    <li>
        <a href="../index.html">
            Resenhas
        </a>
    </li>

    <li>
        <a href="../partemaria/rl.html">
            Ranking
        </a>
    </li>

</ul>

<main class="conteudo">

    <div class="topo">

        <h1>Notificações</h1>

    </div>

    <div class="lista" id="lista">

        <!-- As notificações reais serão colocadas aqui -->

    </div>

</main>


<!-- MODAL -->

<div class="modal" id="modal">

    <div class="caixa">

        <h2 id="tituloModal"></h2>

        <p id="textoModal"></p>

        <button
            class="fechar"
            onclick="fecharModal()"
        >
            Fechar
        </button>

    </div>

</div>


<!-- TOAST -->

<div class="toast" id="toast"></div>


<script>

/* ==========================================
   MENU
========================================== */

const menu =
    document.getElementById("menu");


function toggleMenu(){

    menu.classList.toggle("ativo");

}


document.addEventListener(
    "click",
    function(event){

        const clicouDentroMenu =
            menu.contains(event.target);

        const clicouNoBotao =
            event.target.closest(".cabecalho button");

        if(
            !clicouDentroMenu &&
            !clicouNoBotao
        ){

            menu.classList.remove("ativo");

        }

    }
);


/* ==========================================
   CARREGAR NOTIFICAÇÕES
========================================== */

async function carregarNotificacoes(){

    const usuarioAtual =
        localStorage.getItem("nomeUsuario");

    if(!usuarioAtual){

        console.log(
            "Nenhum usuário conectado."
        );

        mostrarNotificacaoVazia();

        return;

    }


    try{

        const resposta = await fetch(
            "https://://litelab-backend-novo.onrender.com/notificacoes?usuario="
            + encodeURIComponent(usuarioAtual)
        );


        if(!resposta.ok){

            throw new Error(
                "Erro ao carregar notificações."
            );

        }


        const notificacoes =
            await resposta.json();


        const lista =
            document.getElementById("lista");


        lista.innerHTML = "";


        if(notificacoes.length === 0){

            mostrarNotificacaoVazia();

            return;

        }


        notificacoes.forEach(
            function(notificacao){

                criarCardNotificacao(
                    notificacao
                );

            }
        );


    }catch(erro){

        console.error(
            "Erro ao carregar notificações:",
            erro
        );


        document.getElementById(
            "lista"
        ).innerHTML = `

            <div class="card">

                <div class="icone"></div>

                <div class="info">

                    <h3>
                        Erro ao carregar notificações
                    </h3>

                    <p>
                        Verifique se o backend do LiteLAB está funcionando.
                    </p>

                </div>

            </div>

        `;

    }

}


/* ==========================================
   CRIAR CARD
========================================== */

function criarCardNotificacao(
    notificacao
){

    const lista =
        document.getElementById("lista");


    const card =
        document.createElement("div");


    card.className = "card";


    if(notificacao.lida){

        card.classList.add("lida");

    }


    card.dataset.id =
        notificacao.id;


    card.dataset.tipo =
        notificacao.tipo;


    card.onclick =
        function(){

            abrirNotificacao(
                card,
                notificacao
            );

        };


    const data =
        notificacao.criada_em
        ? new Date(
            notificacao.criada_em
          ).toLocaleString(
              "pt-BR"
          )
        : "Agora";


    card.innerHTML = `

        <div class="icone"></div>

        <div class="info">

            <h3>
                ${escaparHtml(
                    notificacao.titulo
                )}
            </h3>

            <p>
                ${escaparHtml(
                    notificacao.mensagem
                )}
            </p>

        </div>

        <div class="hora">

            ${data}

        </div>

    `;


    lista.appendChild(card);

}


/* ==========================================
   NOTIFICAÇÃO VAZIA
========================================== */

function mostrarNotificacaoVazia(){

    const lista =
        document.getElementById("lista");


    lista.innerHTML = `

        <div class="card">

            <div class="icone"></div>

            <div class="info">

                <h3>
                    Nenhuma notificação
                </h3>

                <p>
                    Quando você conquistar algo novo,
                    suas notificações aparecerão aqui.
                </p>

            </div>

        </div>

    `;

}


/* ==========================================
   ABRIR NOTIFICAÇÃO
========================================== */

async function abrirNotificacao(
    card,
    notificacao
){

    card.classList.add("lida");


    const titulo =
        notificacao.titulo;


    const texto =
        notificacao.mensagem;


    document.getElementById(
        "tituloModal"
    ).innerText =
        titulo;


    document.getElementById(
        "textoModal"
    ).innerText =
        texto;


    document.getElementById(
        "modal"
    ).classList.add("aberto");


    mostrarToast(
        "Notificação aberta!"
    );


    /* Marcar no banco como lida */

    const usuarioAtual =
        localStorage.getItem("nomeUsuario");


    if(!usuarioAtual){

        return;

    }


    try{

        await fetch(
            "https://://litelab-backend-novo.onrender.com/marcarNotificacao",
            {

                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:JSON.stringify({

                    id:notificacao.id,

                    usuario:usuarioAtual

                })

            }
        );

    }catch(erro){

        console.error(
            "Erro ao marcar notificação:",
            erro
        );

    }

}


/* ==========================================
   FECHAR MODAL
========================================== */

function fecharModal(){

    document.getElementById(
        "modal"
    ).classList.remove("aberto");

}


/* ==========================================
   TOAST
========================================== */

function mostrarToast(texto){

    const toast =
        document.getElementById("toast");


    toast.innerText =
        texto;


    toast.classList.add(
        "mostrar"
    );


    setTimeout(
        function(){

            toast.classList.remove(
                "mostrar"
            );

        },
        2000
    );

}


/* ==========================================
   FECHAR MODAL CLICANDO FORA
========================================== */

window.addEventListener(
    "click",
    function(e){

        const modal =
            document.getElementById("modal");


        if(e.target === modal){

            fecharModal();

        }

    }
);


/* ==========================================
   PROTEÇÃO CONTRA HTML
========================================== */

function escaparHtml(texto){

    if(texto === null ||
       texto === undefined){

        return "";

    }


    return String(texto)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==========================================
   INICIAR
========================================== */

carregarNotificacoes();

</script>

</body>

</html>
