/* =====================================================
   RANKING - ESTRUTURA IGUAL À PÁGINA DE RESENHAS
===================================================== */


/* FUNDO GERAL */

body {
    background: rgb(32, 73, 81);
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}


/* =====================================================
   CABEÇALHO
===================================================== */

.header-ranking {
    width: 100%;
    height: 130px;

    background: rgb(32, 73, 81);

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;
}


/* LOGO */

.logo-ranking {
    width: 180px;
    height: auto;
    display: block;
}


/* BOTÃO MENU */

.botao-menu-ranking {
    position: absolute;

    top: 1px;
    left: 3px;

    width: auto;
    min-width: 70px;
    height: 37px;

    padding: 2px 7px;

    border: none;
    border-radius: 10px;

    background: #f8f9fa;
    color: #111;

    font-family: Cambria, Georgia, serif;
    font-size: 16px;

    cursor: pointer;
    z-index: 3000;

    white-space: nowrap;
}

.botao-menu-ranking:hover {
    background: #08b6aa;
    color: white;
}


/* =====================================================
   MENU QUE ABRE PELO BOTÃO
===================================================== */

.menu-flutuante {
    list-style: none;

    margin: 0;
    padding: 20px;

    width: 240px;
    height: 100vh;

    position: fixed;

    top: 0;
    left: -300px;

    background: #006161;

    transition: left .3s ease;

    z-index: 5000;
}

.menu-flutuante.ativo {
    left: 0;
}

.menu-flutuante li {
    margin-bottom: 10px;
}

.menu-flutuante a {
    display: block;

    padding: 13px;

    border-radius: 10px;

    background: #008B8B;

    color: white;

    text-decoration: none;
}

.menu-flutuante a:hover {
    background: #08b6aa;
}


/* =====================================================
   FAIXA VERDE DO BREADCRUMB
===================================================== */

.topbar-ranking {
    width: 100%;
    height: 45px;

    background: #08645f;

    display: flex;
    align-items: center;

    padding: 0 13px;

    color: white;

    font-size: 13px;
}

.breadcrumb-ranking {
    display: flex;
    align-items: center;
    gap: 1px;
}

.breadcrumb-ranking .seta {
    font-size: 15px;
}

.breadcrumb-ranking .separador {
    opacity: .4;
}

.breadcrumb-ranking strong {
    font-weight: bold;
}

.breadcrumb-ranking span:last-child {
    opacity: .85;
}


/* =====================================================
   LAYOUT
===================================================== */

.layout-ranking {
    width: 100%;

    display: flex;
    align-items: stretch;

    min-height: calc(100vh - 252px);

    background: rgb(32, 73, 81);
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar-ranking {
    width: 175px;

    flex-shrink: 0;

    background: #08645f;

    padding: 20px 15px;

    min-height: calc(100vh - 252px);
}


/* MENU DA PÁGINA */

.menu-ranking {
    display: flex;

    flex-direction: column;

    gap: 13px;
}


/* BOTÕES */

.menu-ranking .menu-btn {
    width: 100%;

    min-height: 42px;

    border: none;

    border-radius: 14px;

    background: #087b74;

    color: white;

    font-size: 12px;

    font-weight: bold;

    text-align: left;

    padding: 0 15px;

    display: flex;

    align-items: center;

    gap: 12px;

    cursor: pointer;

    transition: .2s ease;
}

.menu-ranking .menu-btn:hover {
    background: #08b6aa;

    transform: translateX(3px);
}

.menu-ranking .menu-btn.ativo {
    background: #08b6aa;
}


/* =====================================================
   CONTEÚDO
===================================================== */

.conteudo-ranking {
    flex: 1;

    min-width: 0;

    padding: 30px 40px 60px 40px;
}


/* =====================================================
   TÍTULO
===================================================== */

.topo-ranking {
    width: 100%;

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 30px;
}

.topo-ranking h1 {
    color: white;

    font-size: 28px;

    font-weight: 500;

    letter-spacing: 1px;
}


/* =====================================================
   FILTROS
===================================================== */

.filtros {
    display: flex;

    gap: 8px;
}

.filtro-btn {
    background: #087b74;

    border: 1px solid #087b74;

    color: white;

    border-radius: 10px;

    padding: 10px 17px;

    font-size: 14px;

    cursor: pointer;

    transition: .2s;
}

.filtro-btn:hover {
    background: #08b6aa;
    border-color: #08b6aa;
}

.filtro-btn.ativo {
    background: #08b6aa;

    color: white;

    border-color: #08b6aa;
}


/* =====================================================
   PODIO
===================================================== */

.podio {
    display: grid;

    grid-template-columns:
        repeat(3, minmax(180px, 216px));

    gap: 16px;

    margin-bottom: 28px;
}


/* CARDS */

.card-top {
    height: 180px;

    background: #f8f9fa;

    border: 1px solid #d5dddd;

    border-radius: 14px;

    text-align: center;

    padding: 15px;

    box-shadow:
        0 2px 4px rgba(0,0,0,.06);

    transition: .2s;

    cursor: pointer;
}

.card-top:hover {
    transform: translateY(-3px);

    box-shadow:
        0 8px 18px rgba(0,0,0,.15);
}

.card-top.primeiro {
    border-color: #f0b900;
}

.card-top.terceiro {
    border-color: #ff9a4b;
}


/* =====================================================
   TABELA
===================================================== */

.tabela-container {
    width: 100%;

    max-width: 1040px;

    background: white;

    border-radius: 14px;

    overflow: hidden;

    border: 1px solid #cde5e4;

    box-shadow:
        0 2px 5px rgba(0,90,90,.04);
}


/* TÍTULO DA TABELA */

.titulo-tabela {
    height: 50px;

    background: #00867f;

    color: white;

    display: flex;

    align-items: center;

    padding-left: 20px;

    font-family: monospace;

    font-size: 14px;

    font-weight: bold;
}


/* IMPORTANTE:
   Mudamos .cabecalho para .cabecalho-tabela
   para não conflitar com o cabeçalho da página.
*/

.cabecalho-tabela {
    height: 43px;

    display: grid;

    grid-template-columns:
        70px
        1.9fr
        82px
        94px
        94px
        90px
        75px;

    align-items: center;

    background: #f8fafb;

    color: #63727b;

    font-size: 11px;

    border-bottom: 1px solid #edf0f0;

    background: transparent;
}

.cabecalho-tabela div {
    padding-left: 15px;
}


/* =====================================================
   RESPONSIVO
===================================================== */

@media (max-width: 900px) {

    .sidebar-ranking {
        width: 190px;
    }

    .conteudo-ranking {
        padding: 35px 25px;
    }

    .podio {
        grid-template-columns:
            repeat(3, 1fr);
    }

    .tabela-container {
        overflow-x: auto;
    }

    .cabecalho-tabela,
    .linha {
        min-width: 700px;
    }
}


@media (max-width: 600px) {

    .header-ranking {
        height: 150px;
    }

    .logo-ranking {
        width: 180px;
    }

    .topbar-ranking {
        height: auto;
        min-height: 60px;

        padding: 12px 15px;
    }

    .layout-ranking {
        flex-direction: column;
    }

    .sidebar-ranking {
        width: 100%;
        min-height: auto;

        padding: 12px;
    }

    .menu-ranking {
        flex-direction: row;
    }

    .menu-ranking .menu-btn {
        min-height: 50px;
        font-size: 13px;
    }

    .conteudo-ranking {
        padding: 25px 15px;
    }

    .topo-ranking {
        flex-direction: column;

        align-items: flex-start;

        gap: 15px;
    }

    .podio {
        grid-template-columns: 1fr;
    }

    .card-top {
        width: 100%;
    }
}

<script>


/* =====================================================
DADOS
===================================================== */

let leitores = [];
let filtroAtual = "todos";


async function carregarRanking() {

    try {

        const resposta = await fetch(
            "https://://litelab-backend-novo.onrender.com/ranking"
        );

        if (!resposta.ok) {

            throw new Error(
                "Erro ao carregar ranking."
            );

        }

        const dados =
            await resposta.json();


        leitores = dados.map(
            function (usuario) {

                const nome =
                    usuario.nome || "Usuário";


                const iniciais =
                    nome
                        .split(" ")
                        .filter(Boolean)
                        .slice(0, 2)
                        .map(
                            function (parte) {
                                return parte
                                    .charAt(0)
                                    .toUpperCase();
                            }
                        )
                        .join("");


                let cargo =
                    "Leitor";


                if (usuario.livros >= 50) {

                    cargo =
                        "Mestre Leitor";

                } else if (usuario.livros >= 20) {

                    cargo =
                        "Leitor Ávido";

                } else if (usuario.livros >= 10) {

                    cargo =
                        "Leitor Entusiasta";

                } else if (usuario.livros >= 1) {

                    cargo =
                        "Leitor Regular";
                }


                return {

                    nome: nome,

                    cargo: cargo,

                    iniciais:
                        iniciais || "L",


                    todos: {

                        livros:
                            usuario.livros || 0,

                        paginas:
                            usuario.paginas || 0,

                        resenhas:
                            usuario.resenhas || 0,

                        avg:
                            Number(
                                usuario.avg || 0
                            ).toFixed(1),

                        dias: 0
                    }

                };

            }
        );


        atualizar();


    } catch (erro) {

        console.error(
            "Erro ao carregar ranking:",
            erro
        );


        document.getElementById(
            "tabelaRanking"
        ).innerHTML = `

            <div style="
                padding: 25px;
                color: #b00020;
                text-align: center;
            ">

                Não foi possível carregar
                o ranking.

            </div>

        `;

    }

}





/* =====================================================
MEDALHAS
===================================================== */

function medalha(posicao) {

if (posicao === 1) {

    return `
        <span class="medalha-tabela ouro">♜</span>
    `;

}


if (posicao === 2) {

    return `
        <span class="medalha-tabela prata">♜</span>
    `;

}


if (posicao === 3) {

    return `
        <span class="medalha-tabela bronze">♜</span>
    `;

}


return `
    <span class="posicao">
        ${posicao}°
    </span>
`;

}


/* =====================================================
ATUALIZAR PODIO
===================================================== */

function atualizarPodio() {

const podio =
    document.getElementById("podio");


const primeiros =
    leitores.slice(0, 3);


podio.innerHTML =
    primeiros.map(
        function (leitor, index) {


            const posicao =
                index + 1;


                const dados =
                leitor.todos;

            let classe = "segundo";


            if (posicao === 1) {

                classe = "primeiro";

            }

            if (posicao === 3) {

                classe = "terceiro";

            }


            let simbolo = "♜";


            return `

                <div
                    class="card-top ${classe}"
                    onclick="abrirLeitor(${index})">


                    <div class="medalha">

                        ${simbolo}

                    </div>


                    <div class="avatar">

                        ${leitor.iniciais}

                    </div>


                    <div class="nome">

                        ${leitor.nome}

                    </div>


                    <div class="cargo">

                        ${leitor.cargo}

                    </div>


                    <div class="livros">

                        ${dados.livros} livros

                    </div>


                </div>

            `;

        }
    ).join("");

}


/* =====================================================
ATUALIZAR TABELA
===================================================== */

function atualizarTabela() {

const tabela =
    document.getElementById(
        "tabelaRanking"
    );


tabela.innerHTML =
    leitores.map(
        function (leitor, index) {


            const posicao =
                index + 1;


                const dados =
                leitor.todos;

            return `

                <div
                    class="linha"
                    onclick="abrirLeitor(${index})">


                    <div>

                        ${medalha(posicao)}

                    </div>


                    <div class="leitor">


                        <div
                            class="avatar-tabela">

                            ${leitor.iniciais}

                        </div>


                        <div>

                            <div class="nome-tabela">

                                ${leitor.nome}

                            </div>


                            <div class="cargo-tabela">

                                ${leitor.cargo}

                            </div>

                        </div>


                    </div>


                    <div class="numero">

                        ${dados.livros}

                    </div>


                    <div class="numero">

                        ${dados.paginas.toLocaleString("pt-BR")}

</div>


<div class="numero">

    ${dados.resenhas}

</div>


<div class="nota">

    <span class="estrela">★</span>

    ${dados.avg}

</div>


<div class="dias">

    ♧ ${dados.dias}

</div>


</div>

`;

}
).join("");

}


/* =====================================================
ATUALIZAR TUDO
===================================================== */

function atualizar() {

atualizarPodio();

atualizarTabela();

}


/* =====================================================
FILTROS MÊS / ANO / TODOS
===================================================== */

function mudarFiltro(
filtro,
botao
) {


filtroAtual = filtro;


document
.querySelectorAll(".filtro-btn")
.forEach(
function (item) {

item.classList.remove(
"ativo"
);

}
);


botao.classList.add("ativo");

carregarRanking();


mostrarToast(
"Ranking atualizado!"
);

}


/* =====================================================
MENU
===================================================== */

function mostrarSecao(secao) {

document
    .querySelectorAll(".menu-ranking .menu-btn")
    .forEach(function(botao) {

        botao.classList.remove("ativo");

    });

document
    .querySelector(".menu-ranking .menu-btn")
    .classList.add("ativo");

mostrarToast(
    "Você está no Ranking Geral."
);

}

ABRIR PERFIL

/* =====================================================

===================================================== */

    </h2>

    <p>

    🥇 <strong>Primeiro Livro</strong><br>
    Você terminou seu primeiro livro.<br><br>

    📚 <strong>Leitor Frequente</strong><br>
    Leu mais de 20 livros.<br><br>

    ⭐ <strong>Crítico Literário</strong><br>
    Publicou mais de 10 resenhas.<br><br>

    🔥 <strong>Leitura Constante</strong><br>
    Manteve uma rotina de leitura.

    </p>

    <button
        class="modal-botao"
        onclick="fecharModal()">

        Fechar

    </button>

`;


document
    .getElementById("modal")
    .classList.add("aberto");

}


/* =====================================================
ABRIR LEITOR
===================================================== */

function abrirLeitor(index) {


const leitor =
leitores[index];

const dados =
    leitor.todos;

document.getElementById(
"conteudoModal"
).innerHTML = `

<h2>
📚 ${leitor.nome}
</h2>

<p>

<strong>
${leitor.cargo}
</strong>

<br><br>

📚 Livros: ${dados.livros}<br>

📖 Páginas:
${dados.paginas.toLocaleString("pt-BR")}<br>

📝 Resenhas:
${dados.resenhas}<br>

⭐ Média:
${dados.avg}<br>

♧ Dias de leitura:
${dados.dias}

</p>


<button
class="modal-botao"
onclick="fecharModal()">

Fechar perfil

</button>

`;


document
.getElementById("modal")
.classList.add("aberto");

}


/* =====================================================
FECHAR MODAL
===================================================== */

function fecharModal() {

document
.getElementById("modal")
.classList.remove("aberto");

}


/* =====================================================
TOAST
===================================================== */

function mostrarToast(mensagem) {


const toast =
document.getElementById("toast");


toast.textContent =
mensagem;


toast.classList.add("mostrar");


setTimeout(
function () {

toast.classList.remove(
"mostrar"
);

},
2200
);

}


/* =====================================================
FECHAR MODAL CLICANDO FORA
===================================================== */

document
.getElementById("modal")
.addEventListener(
"click",
function (evento) {

if (
evento.target === this
) {

fecharModal();

}

}
);


/* =====================================================
INICIAR
===================================================== */

carregarRanking();

</script>
