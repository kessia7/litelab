    <script>
        const menu = document.getElementById("menu");
        
        function toggleMenu() {
          menu.classList.toggle("ativo");
        }
        
    
        document.addEventListener("click", function(event) {
          const clicouDentroMenu = menu.contains(event.target);
          const clicouNoBotao = event.target.closest("button");
        
          if (!clicouDentroMenu && !clicouNoBotao) {
            menu.classList.remove("ativo");
          }
        });
        </script>
    



 
        <div class="estatisticas">

            <h2>📊 Estatísticas</h2>

            <div class="cards-estatisticas">

                <div class="card-estatistica">
                    <div>
                        <p>Em leitura</p>
                        <span id="emLeitura">0</span>

                <div class="card-estatistica">

</div>

<br>

<h2></h2>

<script>

    const nomeUsuario = localStorage.getItem("nomeUsuario");
    
    if (nomeUsuario) {
    
        fetch(
            "http://192.168.0.165:8081/estatisticas?usuario="
            + encodeURIComponent(nomeUsuario)
        )
    
        .then(resposta => {
    
            if (!resposta.ok) {
                throw new Error("Erro ao buscar estatísticas");
            }
    
            return resposta.json();
        })
    
        .then(dados => {
    
            console.log("ESTATÍSTICAS:", dados);
    
            document.getElementById("emLeitura").textContent =
                dados.em_leitura;
    
            document.getElementById("concluidos").textContent =
                dados.concluidos;
    
            document.getElementById("paginasLidas").textContent =
                dados.paginas_lidas;
        })
    
        .catch(erro => {
    
            console.error(
                "Erro ao carregar estatísticas:",
                erro
            );
    
        });
    
    }
    
    </script>
